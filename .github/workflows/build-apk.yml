name: Build Saregama Carvaan APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Set up Java JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Node dependencies
      run: |
        npm install

    - name: Sync Capacitor Android
      run: |
        npx @capacitor/cli sync android

    - name: Build Android Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Saregama-Carvaan-v1.0.0-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: Publish GitHub Release with APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: Saregama Carvaan v1.0.0 APK
        body: |
          ### 📻 Saregama Carvaan 5,000 Songs Mobile App
          - **Download:** Download `app-debug.apk` below and install directly on your Android mobile.
          - **Features:** 5,026 classic songs, Ameen Sayani Geetmala countdowns, and real-time synchronized scrolling lyrics.
          - **Cloud Collection:** [Download/Stream from Mega](https://mega.nz/folder/VzAVUJBB#RyX1V3cxw7jyNu4k6aYebg)
        files: android/app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
