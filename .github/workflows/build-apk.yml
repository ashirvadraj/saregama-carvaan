name: Build Saregama Carvaan APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install dependencies
      run: |
        npm install

    - name: Sync Capacitor Android
      run: |
        npx cap sync android

    - name: Build Android Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Saregama-Carvaan-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master'
      with:
        tag_name: v1.0.0
        name: Saregama Carvaan v1.0.0 APK
        body: |
          ### 📻 Saregama Carvaan 5,000 Songs Mobile APK
          - Download and install `app-debug.apk` directly on your Android phone.
          - 5,026 classic tracks & Ameen Sayani Geetmala countdowns.
          - Real-time synchronized karaoke lyrics.
        files: android/app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
