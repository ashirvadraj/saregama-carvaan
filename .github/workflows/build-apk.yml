name: Build Saregama Carvaan APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Set up Java JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Node dependencies
      run: |
        npm install

    - name: Build Web Application
      run: |
        npm run build

    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: dist
        branch: gh-pages

    - name: Sync Capacitor Android
      run: |
        npx @capacitor/cli sync android

    - name: Build Android Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Saregama-Carvaan-v1.0.0-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: Prepare Named APK
      run: |
        cp android/app/build/outputs/apk/debug/app-debug.apk saregama-carvaan.apk

    - name: Publish GitHub Release with APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: Saregama Carvaan v1.0.0 APK
        make_latest: true
        body: |
          ### 📻 Saregama Carvaan 5,000 Songs Mobile App
          - **Direct Download:** Download `saregama-carvaan.apk` or `app-debug.apk` below and install directly on your Android mobile.
          - **Features:** 5,026 classic Bollywood songs, Ameen Sayani Geetmala countdowns, synchronized lyrics, and 24/7 cloud streaming.
          - **Live Web App:** [https://ashirvadraj.github.io/saregama-carvaan/](https://ashirvadraj.github.io/saregama-carvaan/)
          - **Archive.org Collection:** [https://archive.org/details/saregama-carvaan-5000-songs-collection](https://archive.org/details/saregama-carvaan-5000-songs-collection)
        files: |
          android/app/build/outputs/apk/debug/app-debug.apk
          saregama-carvaan.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
